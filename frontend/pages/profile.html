    <style id="theme-vars">
/* GeoMate 移动端 — 品牌设计令牌 v2（Apple 质感升级）
 * 风格：克制 · 优雅 · 高级（参考苹果 HIG 设计语言）
 * 主色：GeoMate 青绿（教育/自然调性）+ 苹果式中性银灰底
 * 重点：强对比文本层级、鲜亮主色、细腻分层
 * 动效：卡片提升、胶囊按钮反馈、入场动画（尊重减少动效偏好）
 * 品牌前缀：gm
 */

:root {
  /* ── 色彩通道（苹果 HIG 色阶） ─────────────── */
  --gm-background: #F5F5F7;        /* Silver Mist 页面底 */
  --gm-foreground: #1D1D1F;        /* 苹果 text-800 主文字 */
  --gm-card: #FFFFFF;              /* 卡片 */
  --gm-card-foreground: #1D1D1F;
  --gm-popover: #FFFFFF;
  --gm-popover-foreground: #1D1D1F;
  --gm-primary: #2E7D5B;           /* GeoMate 青绿（鲜亮强调） */
  --gm-primary-foreground: #FFFFFF;
  --gm-muted: #ECECF1;             /* 苹果式浅灰面 */
  --gm-muted-foreground: #6E6E73;  /* 苹果 text-500 次要文字 */
  --gm-border: #E3E3E8;            /* 苹果 background-200/300 */
  --gm-input: #D1D1D6;
  --gm-ring: #2E7D5B;

  /* ── 扩展色（单一主色体系内） ─────────────── */
  --gm-ink-2: #6E6E73;             /* 次级文字（苹果 500） */
  --gm-ink-3: #8E8E93;             /* 三级文字（苹果 400） */
  --gm-surface-2: #ECECF1;         /* 悬浮/选中面 */
  --gm-primary-soft: #E4F1EA;      /* 主色 8% 浅底 */

  /* ── 状态色（苹果系统色，仅用于真实状态） ─── */
  --gm-state-success: #34C759;
  --gm-state-warning: #FF9500;
  --gm-state-error: #FF3B30;
  --gm-state-info: #007AFF;

  /* ── 圆角（苹果全局 1.2rem 感，卡片 16px 上限） ─ */
  --gm-radius-sm: 10px;
  --gm-radius-md: 12px;
  --gm-radius-lg: 16px;

  /* ── 字体（苹果参考库 DM Sans + 中文回退） ─── */
  --gm-font-sans: "DM Sans", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --gm-font-mono: "JetBrains Mono", ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;

  /* ── 阴影：安静分层（静态 alpha<=0.05，交互提升） ─ */
  --gm-shadow-1: 0 1px 2px rgba(0, 0, 0, 0.04);
  --gm-shadow-2: 0 4px 8px -2px rgba(0, 0, 0, 0.06), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
  --gm-shadow-3: 0 8px 24px -8px rgba(0, 0, 0, 0.10), 0 4px 8px -4px rgba(0, 0, 0, 0.06);
}

/* Tailwind 语义令牌桥接（供 apply-html-head-contract 生成 @theme inline） */
@theme inline {
  --color-background: var(--gm-background);
  --color-foreground: var(--gm-foreground);
  --color-card: var(--gm-card);
  --color-card-foreground: var(--gm-card-foreground);
  --color-popover: var(--gm-popover);
  --color-popover-foreground: var(--gm-popover-foreground);
  --color-primary: var(--gm-primary);
  --color-primary-foreground: var(--gm-primary-foreground);
  --color-muted: var(--gm-muted);
  --color-muted-foreground: var(--gm-muted-foreground);
  --color-border: var(--gm-border);
  --color-input: var(--gm-input);
  --color-ring: var(--gm-ring);
  --color-ink-2: var(--gm-ink-2);
  --color-ink-3: var(--gm-ink-3);
  --color-surface-2: var(--gm-surface-2);
  --color-primary-soft: var(--gm-primary-soft);
  --color-state-success: var(--gm-state-success);
  --color-state-warning: var(--gm-state-warning);
  --color-state-error: var(--gm-state-error);
  --color-state-info: var(--gm-state-info);
  --radius-sm: var(--gm-radius-sm);
  --radius-md: var(--gm-radius-md);
  --radius-lg: var(--gm-radius-lg);
  --font-sans: var(--gm-font-sans);
  --font-mono: var(--gm-font-mono);
  --shadow-card: var(--gm-shadow-1);
  --shadow-raised: var(--gm-shadow-2);
  --shadow-float: var(--gm-shadow-3);
}

/* ── 基础排版 ──────────────────────────────── */
html,
body {
  font-family: var(--gm-font-sans);
  color: var(--gm-foreground);
  background: var(--gm-background);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  letter-spacing: 0;
}

/* ── 入场动画（克制、苹果式） ──────────────── */
@keyframes gm-rise {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes gm-fade {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}

/* ── 通用组件类 ────────────────────────────── */
.gm-card {
  background: var(--gm-card);
  border: 1px solid var(--gm-border);
  border-radius: var(--gm-radius-lg);
  box-shadow: var(--gm-shadow-1);
  transition: transform 180ms cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 180ms cubic-bezier(0.2, 0.8, 0.2, 1);
  animation: gm-rise 340ms cubic-bezier(0.3, 0, 0, 1) both;
}

.gm-card:hover {
  transform: translateY(-2px);
  box-shadow: var(--gm-shadow-3);
}

.gm-card:active {
  transform: translateY(0) scale(0.985);
}

.gm-card-flat {
  background: var(--gm-card);
  border-radius: var(--gm-radius-lg);
  box-shadow: var(--gm-shadow-1);
  transition: transform 180ms cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 180ms cubic-bezier(0.2, 0.8, 0.2, 1);
  animation: gm-rise 340ms cubic-bezier(0.3, 0, 0, 1) both;
}

.gm-card-flat:hover {
  transform: translateY(-2px);
  box-shadow: var(--gm-shadow-3);
}

.gm-card-flat:active {
  transform: translateY(0) scale(0.985);
}

.gm-chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  height: 30px;
  padding: 0 14px;
  border-radius: 999px;
  background: var(--gm-muted);
  color: var(--gm-ink-2);
  font-size: 13px;
  font-weight: 500;
  line-height: 1;
  white-space: nowrap;
  transition: background-color 180ms ease, color 180ms ease, transform 140ms cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 180ms ease;
}

.gm-chip:hover {
  background: #E1E1E7;
}

.gm-chip:active {
  transform: scale(0.96);
}

.gm-chip-active {
  background: var(--gm-primary);
  color: var(--gm-primary-foreground);
  font-weight: 600;
  box-shadow: 0 2px 8px -2px rgba(0, 0, 0, 0.16);
}

.gm-chip-active:hover {
  background: #27704F;
}

.gm-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  height: 48px;
  padding: 0 22px;
  border-radius: 999px;
  font-size: 15px;
  font-weight: 600;
  line-height: 1;
  transition: background-color 180ms ease, color 180ms ease, transform 140ms cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 180ms ease, filter 180ms ease;
}

.gm-btn:active {
  transform: scale(0.97);
}

.gm-btn-primary {
  background: var(--gm-primary);
  color: var(--gm-primary-foreground);
  box-shadow: 0 2px 8px -2px rgba(0, 0, 0, 0.18);
}

.gm-btn-primary:hover {
  background: #27704F;
  transform: translateY(-1px);
  box-shadow: 0 6px 16px -6px rgba(0, 0, 0, 0.22);
}

.gm-btn-ghost {
  background: transparent;
  color: var(--gm-ink-2);
  border: 1px solid var(--gm-border);
  box-shadow: var(--gm-shadow-1);
}

.gm-btn-ghost:hover {
  background: var(--gm-surface-2);
}

.gm-row {
  display: flex;
  align-items: center;
  gap: 12px;
}

.gm-icon-tile {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 40px;
  height: 40px;
  border-radius: var(--gm-radius-md);
  background: var(--gm-primary-soft);
  color: var(--gm-primary);
  flex-shrink: 0;
  transition: transform 180ms cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 180ms ease;
}

.gm-icon-tile:hover {
  transform: translateY(-1px);
  box-shadow: var(--gm-shadow-2);
}

.gm-section-title {
  font-size: 17px;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--gm-foreground);
}

.gm-hairline {
  height: 1px;
  background: var(--gm-border);
  border: 0;
}

.gm-input {
  width: 100%;
  height: 48px;
  padding: 0 16px;
  border-radius: var(--gm-radius-md);
  border: 1px solid var(--gm-input);
  background: var(--gm-card);
  color: var(--gm-foreground);
  font-size: 15px;
  outline: none;
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
  transition: border-color 180ms ease, box-shadow 180ms ease;
}

.gm-input::placeholder {
  color: var(--gm-ink-3);
}

.gm-input:focus {
  border-color: var(--gm-ring);
  box-shadow: 0 0 0 3px rgba(46, 125, 91, 0.18);
}

.gm-progress {
  height: 8px;
  border-radius: 999px;
  background: var(--gm-muted);
  overflow: hidden;
}

.gm-progress-bar {
  height: 100%;
  border-radius: 999px;
  background: var(--gm-primary);
  transition: width 400ms cubic-bezier(0.3, 0, 0, 1);
}

/* ── 底部导航：苹果式毛玻璃 + 微动效 ───────── */
[data-mobile-nav="global"] {
  background: rgba(255, 255, 255, 0.86);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  backdrop-filter: saturate(180%) blur(20px);
  box-shadow: 0 -1px 0 rgba(0, 0, 0, 0.04), 0 -8px 24px -16px rgba(0, 0, 0, 0.14);
}

[data-mobile-nav="global"] a {
  transition: color 180ms ease, transform 140ms cubic-bezier(0.2, 0.8, 0.2, 1);
}

[data-mobile-nav="global"] a:active {
  transform: scale(0.94);
}

[data-mobile-nav="global"] a i {
  transition: transform 180ms cubic-bezier(0.2, 0.8, 0.2, 1);
}

[data-mobile-nav="global"] a:hover i {
  transform: translateY(-1px);
}

/* ── 减少动效偏好：全部降级 ────────────────── */
@media (prefers-reduced-motion: reduce) {
  .gm-card,
  .gm-card-flat,
  .gm-chip,
  .gm-btn,
  .gm-icon-tile,
  .gm-progress-bar,
  [data-mobile-nav="global"] a,
  [data-mobile-nav="global"] a i {
    animation: none !important;
    transition: none !important;
    transform: none !important;
  }
}
