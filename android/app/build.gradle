plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.geomate.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.geomate.app"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0.0"

        // Android 常用 CPU 架构（Chaquopy 需要）
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }

        python {
            // 目标 Python 版本（需 ≥3.9 以支持后端代码语法）
            version "3.11"
            // 构建机 Python（用于 venv/pip），需含 venv 模块
            buildPython "D:/GeoMate_Android_venv/Scripts/python.exe"
            pip {
                // Chaquopy 依赖：从 requirements.txt 安装（Android 可用包）
                install "-r", "C:/Users/sennei kuanhou/Desktop/GeoMate/android_app/app/src/main/python/requirements.txt"
                // 使用 Chaquopy 默认索引（chaquo.com/pypi，提供 Android wheel）
                // chaquo.com 国内访问慢，加大超时并启用重试
                options "--timeout", "120", "--retries", "10"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // 便于查看日志
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}
