<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- GeoMate 应用图标 v2：简约苹果风
       融合罗盘（环+刻度）· 地质锤（锤形指针）· 放大镜（探索视角） -->
  <defs>
    <linearGradient id="gm-bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E7D5B"/>
      <stop offset="1" stop-color="#20543E"/>
    </linearGradient>
  </defs>

  <!-- 底色：更圆润的 squircle -->
  <rect width="1024" height="1024" rx="262" fill="url(#gm-bg2)"/>

  <!-- 罗盘：细线单环 + 四点刻度 -->
  <circle cx="512" cy="512" r="312" fill="none" stroke="#FFFFFF" stroke-width="14" opacity="0.95"/>
  <circle cx="512" cy="512" r="252" fill="none" stroke="#FFFFFF" stroke-width="4" opacity="0.4"/>
  <circle cx="512" cy="236" r="12" fill="#FFFFFF"/>
  <circle cx="788" cy="512" r="12" fill="#FFFFFF"/>
  <circle cx="512" cy="788" r="12" fill="#FFFFFF"/>
  <circle cx="236" cy="512" r="12" fill="#FFFFFF"/>

  <!-- 锤形指针：地质锤抽象（菱形锤头 + 细柄指向 NE） -->
  <polygon points="512,392 586,512 512,632 438,512" fill="#F5B35A"/>
  <line x1="586" y1="512" x2="672" y2="384" stroke="#F5B35A" stroke-width="18" stroke-linecap="round"/>
  <circle cx="512" cy="512" r="16" fill="#FAF9F5"/>

  <!-- 放大镜：右上探索视角 -->
  <circle cx="712" cy="300" r="92" fill="rgba(255,255,255,0.12)" stroke="#FFFFFF" stroke-width="16"/>
  <line x1="776" y1="364" x2="852" y2="288" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round"/>
</svg>
