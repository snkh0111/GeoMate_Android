    <style id="theme-vars">
/* GeoMate 移动端 — 品牌设计令牌 v4（苹果极简美学）
 * 设计方向：refined minimalism（克制 · 精确 · 留白 · 单一强调色）
 * 参考：苹果 HIG + 苹果设计库（Poppins/Noto Sans SC）
 * 关键变化：纯白/近白底、精细灰阶、SF Pro 风格系统字体栈、
 *           更小圆角、更安静阴影、动效只保留关键时刻
 * 品牌前缀：gm
 */

:root {
  /* ── 色彩通道（苹果 HIG 纯净灰阶） ───────── */
  --gm-background: #F5F5F7;        /* 苹果 Silver Mist 页面底 */
  --gm-foreground: #1D1D1F;        /* 苹果 text-800 主文字 */
  --gm-card: #FFFFFF;              /* 纯白卡片 */
  --gm-card-foreground: #1D1D1F;
  --gm-popover: #FFFFFF;
  --gm-popover-foreground: #1D1D1F;
  --gm-primary: #2E7D5B;           /* GeoMate 青绿（唯一强调色） */
  --gm-primary-foreground: #FFFFFF;
  --gm-muted: #F2F2F7;             /* 苹果 background-200 */
  --gm-muted-foreground: #6E6E73;  /* 苹果 text-500 */
  --gm-border: #E5E5EA;            /* 苹果 background-300 */
  --gm-input: #D1D1D6;
  --gm-ring: #2E7D5B;

  /* ── 扩展色（单一主色体系内） ─────────────── */
  --gm-ink-2: #6E6E73;             /* 次级文字 */
  --gm-ink-3: #AEAEB2;             /* 三级文字（苹果 400） */
  --gm-surface-2: #EBEBF0;         /* 悬浮/选中面 */
  --gm-primary-soft: #E7F2EC;      /* 主色 8% 浅底 */

  /* ── 状态色（苹果系统色，仅用于真实状态） ─── */
  --gm-state-success: #34C759;
  --gm-state-warning: #FF9500;
  --gm-state-error: #FF3B30;
  --gm-state-info: #007AFF;

  /* ── 圆角（苹果精细体系：10 / 12 / 16） ───── */
  --gm-radius-sm: 10px;
  --gm-radius-md: 12px;
  --gm-radius-lg: 16px;

  /* ── 字体（SF Pro 风格系统栈，Android WebView 流畅） ─ */
  --gm-font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --gm-font-mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;

  /* ── 阴影：极致安静（静态 alpha<=0.04，交互微升） ─ */
  --gm-shadow-1: 0 1px 2px rgba(0, 0, 0, 0.04);
  --gm-shadow-2: 0 2px 8px -2px rgba(0, 0, 0, 0.06), 0 1px 2px -1px rgba(0, 0, 0, 0.04);
  --gm-shadow-3: 0 8px 24px -8px rgba(0, 0, 0, 0.10), 0 4px 8px -4px rgba(0, 0, 0, 0.06);
}

/* Tailwind 语义令牌桥接（供 apply-html-head-contract 生成 @theme inline） */
@theme inline {
  --color-background: var(--gm-background);
  --color-foreground: var(--gm-foreground);
  --color-card: var(--gm-card);
  --color-card-foreground: var(--gm-card-foreground);
  --color-popover: var(--gm-popover);
  --color-popover-foreground: var(--gm-popover-foreground);
  --color-primary: var(--gm-primary);
  --color-primary-foreground: var(--gm-primary-foreground);
  --color-muted: var(--gm-muted);
  --color-muted-foreground: var(--gm-muted-foreground);
  --color-border: var(--gm-border);
  --color-input: var(--gm-input);
  --color-ring: var(--gm-ring);
  --color-ink-2: var(--gm-ink-2);
  --color-ink-3: var(--gm-ink-3);
  --color-surface-2: var(--gm-surface-2);
  --color-primary-soft: var(--gm-primary-soft);
  --color-state-success: var(--gm-state-success);
  --color-state-warning: var(--gm-state-warning);
  --color-state-error: var(--gm-state-error);
  --color-state-info: var(--gm-state-info);
  --radius-sm: var(--gm-radius-sm);
  --radius-md: var(--gm-radius-md);
  --radius-lg: var(--gm-radius-lg);
  --font-sans: var(--gm-font-sans);
  --font-mono: var(--gm-font-mono);
  --shadow-card: var(--gm-shadow-1);
  --shadow-raised: var(--gm-shadow-2);
  --shadow-float: var(--gm-shadow-3);
}

/* ── 基础排版 ──────────────────────────────── */
html,
body {
  font-family: var(--gm-font-sans);
  color: var(--gm-foreground);
  background: var(--gm-background);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  letter-spacing: -0.01em;
}

/* ── 入场动画（克制、一次性的） ────────────── */
@keyframes gm-rise {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* ── 通用组件类（苹果极简） ────────────────── */
.gm-card {
  background: var(--gm-card);
  border: 1px solid var(--gm-border);
  border-radius: var(--gm-radius-lg);
  box-shadow: var(--gm-shadow-1);
  transition: transform 200ms cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 200ms cubic-bezier(0.2, 0.8, 0.2, 1);
  animation: gm-rise 320ms cubic-bezier(0.3, 0, 0, 1) both;
}

.gm-card:hover {
  transform: translateY(-1px);
  box-shadow: var(--gm-shadow-3);
}

.gm-card:active {
  transform: translateY(0) scale(0.99);
}

.gm-card-flat {
  background: var(--gm-card);
  border-radius: var(--gm-radius-lg);
  box-shadow: var(--gm-shadow-1);
  transition: transform 200ms cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 200ms cubic-bezier(0.2, 0.8, 0.2, 1);
  animation: gm-rise 320ms cubic-bezier(0.3, 0, 0, 1) both;
}

.gm-card-flat:hover {
  transform: translateY(-1px);
  box-shadow: var(--gm-shadow-3);
}

.gm-card-flat:active {
  transform: translateY(0) scale(0.99);
}

.gm-chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  height: 30px;
  padding: 0 14px;
  border-radius: 999px;
  background: var(--gm-muted);
  color: var(--gm-ink-2);
  font-size: 13px;
  font-weight: 500;
  line-height: 1;
  white-space: nowrap;
  transition: background-color 160ms ease, color 160ms ease, transform 120ms cubic-bezier(0.2, 0.8, 0.2, 1);
}

.gm-chip:hover {
  background: #E8E8ED;
}

.gm-chip:active {
  transform: scale(0.97);
}

.gm-chip-active {
  background: var(--gm-primary);
  color: var(--gm-primary-foreground);
  font-weight: 600;
}

.gm-chip-active:hover {
  background: #27704F;
}

.gm-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  height: 48px;
  padding: 0 22px;
  border-radius: 999px;
  font-size: 15px;
  font-weight: 600;
  line-height: 1;
  transition: background-color 160ms ease, color 160ms ease, transform 120ms cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 160ms ease;
}

.gm-btn:active {
  transform: scale(0.97);
}

.gm-btn-primary {
  background: var(--gm-primary);
  color: var(--gm-primary-foreground);
}

.gm-btn-primary:hover {
  background: #27704F;
}

.gm-btn-ghost {
  background: transparent;
  color: var(--gm-ink-2);
  border: 1px solid var(--gm-border);
}

.gm-btn-ghost:hover {
  background: var(--gm-surface-2);
}

.gm-row {
  display: flex;
  align-items: center;
  gap: 12px;
}

.gm-icon-tile {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 40px;
  height: 40px;
  border-radius: var(--gm-radius-md);
  background: var(--gm-primary-soft);
  color: var(--gm-primary);
  flex-shrink: 0;
}

.gm-section-title {
  font-size: 17px;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--gm-foreground);
}

.gm-hairline {
  height: 1px;
  background: var(--gm-border);
  border: 0;
}

.gm-input {
  width: 100%;
  height: 48px;
  padding: 0 16px;
  border-radius: var(--gm-radius-md);
  border: 1px solid var(--gm-input);
  background: var(--gm-card);
  color: var(--gm-foreground);
  font-size: 15px;
  outline: none;
  transition: border-color 160ms ease, box-shadow 160ms ease;
}

.gm-input::placeholder {
  color: var(--gm-ink-3);
}

.gm-input:focus {
  border-color: var(--gm-ring);
  box-shadow: 0 0 0 3px rgba(46, 125, 91, 0.16);
}

.gm-progress {
  height: 7px;
  border-radius: 999px;
  background: var(--gm-muted);
  overflow: hidden;
}

.gm-progress-bar {
  height: 100%;
  border-radius: 999px;
  background: var(--gm-primary);
  transition: width 360ms cubic-bezier(0.3, 0, 0, 1);
}

/* ── 底部导航：固定置底 + 苹果式毛玻璃（克制） ── */
[data-mobile-nav="global"] {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  width: 100%;
  max-width: 28rem;
  margin: 0 auto;
  z-index: 50;
  background: rgba(255, 255, 255, 0.82);
  -webkit-backdrop-filter: saturate(180%) blur(16px);
  backdrop-filter: saturate(180%) blur(16px);
  box-shadow: 0 -1px 0 rgba(0, 0, 0, 0.03);
}

/* 内容底部留出导航高度，避免遮挡（含 iPhone 安全区） */
main {
  padding-bottom: calc(64px + env(safe-area-inset-bottom, 0px));
}

[data-mobile-nav="global"] a {
  transition: color 160ms ease, transform 120ms cubic-bezier(0.2, 0.8, 0.2, 1);
}

[data-mobile-nav="global"] a:active {
  transform: scale(0.95);
}

/* ── 减少动效偏好：全部降级 ────────────────── */
@media (prefers-reduced-motion: reduce) {
  .gm-card,
  .gm-card-flat,
  .gm-chip,
  .gm-btn,
  .gm-icon-tile,
  .gm-progress-bar,
  [data-mobile-nav="global"] a {
    animation: none !important;
    transition: none !important;
    transform: none !important;
  }
}

        <style id="critical-layout">
          html,
          body {
            overflow-x: hidden;
          }

          .gm-page {
            width: 100%;
            max-width: 28rem;
            margin-inline: auto;
          }

          .page-header {
            position: sticky;
            top: 0;
            z-index: 40;
            background: color-mix(in srgb, var(--gm-background) 90%, transparent);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
          }

          .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
          }

          .chips-scroll {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            -ms-overflow-style: none;
            scrollbar-width: none;
          }

          .chips-scroll::-webkit-scrollbar {
            display: none;
          }

          .chips-scroll .gm-chip {
            border: 0;
            cursor: pointer;
            flex-shrink: 0;
            font-family: inherit;
          }

          .meta-row {
            flex-wrap: wrap;
            row-gap: 6px;
          }

          .note-body {
            min-width: 0;
            flex: 1;
          }

          button {
            -webkit-tap-highlight-color: transparent;
          }

          /* ── 编辑记录浮层（苹果极简底部面板） ── */
          .note-sheet {
            position: fixed;
            inset: 0;
            z-index: 60;
            display: flex;
            align-items: flex-end;
            justify-content: center;
          }
          .note-sheet.hidden {
            display: none;
          }
          .note-sheet-backdrop {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.32);
            -webkit-backdrop-filter: blur(2px);
            backdrop-filter: blur(2px);
          }
          .note-sheet-panel {
            position: relative;
            width: 100%;
            max-width: 28rem;
            border-radius: 24px 24px 0 0;
            background: var(--gm-card);
            box-shadow: 0 -8px 32px -8px rgba(0, 0, 0, 0.18);
            animation: gm-sheet-up 260ms cubic-bezier(0.32, 0.72, 0, 1) both;
          }
          @keyframes gm-sheet-up {
            from {
              transform: translateY(100%);
              opacity: 0;
            }
            to {
              transform: translateY(0);
              opacity: 1;
            }
          }
          .note-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
          }
          .note-act {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 999px;
            color: var(--gm-ink-2);
            border: 1px solid var(--gm-border);
            background: var(--gm-card);
            transition: background-color 160ms ease, color 160ms ease;
          }
          .note-act:hover {
            background: var(--gm-surface-2);
          }
          .note-act-del {
            color: var(--gm-state-error);
          }
          .note-act-del:hover {
            background: rgba(255, 59, 48, 0.08);
          }
        </style>

                    </button>
                    <h1 class="flex-1 text-center text-[16px] font-semibold">野外记录</h1>
                    <span class="w-11 text-right text-[13px] text-ink-3" id="notes-count">0 条</span>
                </div>
            </header>

            <div class="px-4">
                <!-- 筛选 chips -->
                <div class="chips-scroll mt-3 flex gap-2" id="notes-filters">
                    <button class="gm-chip gm-chip-active" data-route="all">全部路线</button>
                </div>

                <!-- 记录卡片列表 -->
                <div class="mt-4 space-y-3" id="notes-list">
                    <!-- 记录由 notes.js 从后端 /notes 渲染，结构与原设计一致 -->
                </div>

                <!-- 底部操作 -->
                <button data-dom-id="fab-notes" class="gm-btn gm-btn-primary mt-6 h-12 w-full">
                    <i data-lucide="plus" class="h-5 w-5"></i>新增记录
                </button>
            </div>

            <footer class="py-6 text-center">
                <p class="text-[12px] text-ink-3">GeoMate · 威海地质野外实习助手</p>
            </footer>
        </div>

        <!-- 编辑记录浮层（苹果极简底部面板） -->
        <div id="note-editor" class="note-sheet hidden" role="dialog" aria-modal="true" aria-label="编辑野外记录">
            <div class="note-sheet-backdrop" data-close-note-editor></div>
            <div class="note-sheet-panel">
                <div class="flex items-center justify-between px-5 pt-5">
                    <h2 class="gm-section-title">编辑记录</h2>
                    <button type="button" data-close-note-editor aria-label="关闭" class="flex h-9 w-9 items-center justify-center rounded-full text-ink-2">
                        <i data-lucide="x" class="h-5 w-5"></i>
                    </button>
                </div>
                <form id="note-form" class="mt-4 space-y-4 px-5 pb-6">
                    <input type="hidden" id="note-id">
                    <div>
                        <label for="note-point" class="mb-2 block text-[13px] font-medium text-ink-2">点位编号</label>
                        <input id="note-point" class="gm-input" type="text" placeholder="如 D1-1">
                    </div>
                    <div>
                        <label for="note-rock" class="mb-2 block text-[13px] font-medium text-ink-2">岩石类型</label>
                        <input id="note-rock" class="gm-input" type="text" placeholder="如 花岗岩">
                    </div>
                    <div>
                        <label for="note-loc" class="mb-2 block text-[13px] font-medium text-ink-2">地点</label>
                        <input id="note-loc" class="gm-input" type="text" placeholder="如 占甲埠村采石场西侧">
                    </div>
                    <div>
                        <label for="note-desc" class="mb-2 block text-[13px] font-medium text-ink-2">地质描述</label>
                        <textarea id="note-desc" class="gm-input min-h-[96px] resize-none py-3" placeholder="记录岩性、结构、构造等观察描述"></textarea>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label for="note-attitude" class="mb-2 block text-[13px] font-medium text-ink-2">产状（∠）</label>
                            <input id="note-attitude" class="gm-input" type="text" placeholder="如 300°∠35°">
                        </div>
                        <div>
                            <label for="note-weather" class="mb-2 block text-[13px] font-medium text-ink-2">天气</label>
                            <input id="note-weather" class="gm-input" type="text" placeholder="如 晴">
                        </div>
                    </div>
                    <button type="submit" class="gm-btn gm-btn-primary w-full">保存修改</button>
                </form>
            </div>
        </div>
    </main>
    <script>lucide.createIcons();</script>
    <!-- GeoMate 导航与交互层 -->
    <script src="../assets/js/nav.js"></script>
    <!-- GeoMate API Client -->
    <script src="../assets/js/api.js"></script>
    <!-- GeoMate 野外记录（后端数据渲染） -->
    <script src="../assets/js/notes.js"></script>
</body>
</html>
